server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: subscription-management-system
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Security & JWT Configuration
app:
  jwt:
    # 256-bit secret key for HMAC-SHA256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
    reset-token-expiration-minutes: 15
  billing:
    cron: "0 0 1 * * ?" # Daily at 1:00 AM UTC
    enabled: true
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:80"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
