services:
  - type: web
    name: avimukta-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: avimukta-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: avimukta-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: avimukta-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: avimukta-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: avimukta-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_JWT_SECRET
        sync: false

databases:
  - name: avimukta-db
    databaseName: brightloop_subscription_db
    user: brightloop
